name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  core-tests:
    name: core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (core only, no JUCE)
        run: cmake -B build-core -DSAPPSYNTH_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-core --config Release -j 4

      - name: Run unit tests
        run: ctest --test-dir build-core -C Release --output-on-failure

  plugin-macos:
    name: plugin build + pluginval (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (full, fetches JUCE 8.0.15)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSAPPSYNTH_BUILD_TESTS=OFF

      - name: Build all formats
        run: cmake --build build --config Release -j 4

      - name: pluginval (VST3, strictness 5)
        run: |
          curl -LsSo pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 5 --validate-in-process --timeout-ms 120000 \
            "build/SappSynthPlugin_artefacts/Release/VST3/SappSynth.vst3"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: SappSynth-macOS-${{ github.sha }}
          path: |
            build/SappSynthPlugin_artefacts/Release/VST3
            build/SappSynthPlugin_artefacts/Release/AU
            build/SappSynthPlugin_artefacts/Release/Standalone

  plugin-windows:
    name: plugin build + pluginval (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (full, fetches JUCE 8.0.15)
        run: cmake -B build -DSAPPSYNTH_BUILD_TESTS=OFF -DSAPPSYNTH_BUILD_TOOLS=OFF

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release -j 4

      - name: pluginval (VST3, strictness 5)
        shell: pwsh
        run: |
          curl.exe -LsSo pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 120000 "build/SappSynthPlugin_artefacts/Release/VST3/SappSynth.vst3"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: SappSynth-Windows-${{ github.sha }}
          path: |
            build/SappSynthPlugin_artefacts/Release/VST3
            build/SappSynthPlugin_artefacts/Release/Standalone
