# sapp.yml — single manifest for the sapp* suite. schema: sapp/1
# Sections mirror the legacy per-tool dotfiles (see sapptools/_project/upgrade/SPEC-manifest.md).
# A tool reads its section here FIRST; legacy dotfiles are fallback only.
schema: sapp/1
monitor:
  schema: 1
  id: sappsynth
  name: sappsynth
  description: >
    Professional virtual-analog synthesizer plugin (VST3/AU/CLAP + standalone)
    with an educational Lab Mode — C++20, JUCE 9, CMake.
  status: paused
  tags:
    - desktop
    - audio
    - plugin
  owner: localteampartners@gmail.com
  urls:
    repo: https://github.com/localteampartners/sappsynth.git
  host:
    vps: none
  stack:
    runtime: c++20
    framework: juce 8.0.15 (cmake)
    database: none
    key_libraries:
      - JUCE
      - Catch2
    external_services: []
  purpose: |
    Professional virtual-analog synthesizer (VST3/AU/CLAP + standalone) that
    doubles as an interactive lab for learning how synths work. Distributed
    via GitHub — no hosted service, so no HTTP health checks.
  features:
    - Two-oscillator subtractive engine with nonlinear ladder filter
    - Structured analog variation (unit/voice/note/drift scopes)
    - Lab Mode: stage solo/bypass, ideal-vs-modeled comparison, experiments
  checks: []
  notes: |
    Desktop audio plugin — monitor stays paused (nothing to health-check).
    Full architecture plan: docs/architecture.md.
security:
  thresholds:
    critical: 0
    high: 0
    medium: -1
    low: -1
    info: -1
  ignore: []
  disabledRules: []
  severityOverrides: {}
  scanners: []
  deepReview:
    enabled: false
    model: claude-sonnet-4-6
    maxFiles: 20
project:
  name: sappsynth
